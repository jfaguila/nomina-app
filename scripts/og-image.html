<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,#0E2438 0%,#0c2033 55%,#0A1A2B 100%);
    color:#fff; position:relative; overflow:hidden;
  }
  .glow-a { position:absolute; right:-160px; top:-190px; width:560px; height:560px; border-radius:50%;
            background:rgba(163,230,53,0.09); filter:blur(100px); }
  .glow-b { position:absolute; left:-120px; bottom:-200px; width:420px; height:420px; border-radius:50%;
            background:rgba(34,211,238,0.09); filter:blur(90px); }
  .wrap { position:relative; padding:64px 72px; height:100%; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand .mark { width:56px; height:56px; }
  .brand .name { font-size:31px; font-weight:800; letter-spacing:-0.02em; }
  .brand .name span { color:#a3e635; }
  .badge { margin-top:44px; display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
           background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
           border-radius:999px; padding:9px 18px; font-size:14px; letter-spacing:0.16em;
           text-transform:uppercase; color:#bef264; font-family:ui-monospace,Menlo,monospace; }
  .dot { width:8px; height:8px; border-radius:50%; background:#a3e635; display:inline-block; }
  h1 { margin-top:26px; font-size:82px; line-height:0.99; font-weight:800; letter-spacing:-0.035em; }
  h1 em { color:#a3e635; font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:400; letter-spacing:-0.01em; }
  p.sub { margin-top:24px; font-size:27px; line-height:1.42; color:rgba(226,232,240,0.92); max-width:830px; }
  p.sub b { color:#fff; font-weight:700; }
  .feats { margin-top:auto; display:flex; gap:38px; font-size:20px; color:rgba(203,213,225,0.95); }
  .feats span { display:flex; align-items:center; gap:10px; }
  .feats .tick { color:#a3e635; font-weight:800; font-size:22px; }
  .url { position:absolute; right:72px; bottom:64px; font-size:22px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:-0.01em; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop stop-color="#2B57F6"/><stop offset="1" stop-color="#1E3FCC"/></linearGradient></defs>
        <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g)"/>
        <path d="M15 11 H38 L46 19 V49 H15 Z" fill="#fff"/>
        <path d="M38 11 V19 H46 Z" fill="#C2D2FF"/>
        <rect x="20" y="25" width="18" height="2.6" rx="1.3" fill="#C9D6FF"/>
        <rect x="20" y="31" width="18" height="2.6" rx="1.3" fill="#C9D6FF"/>
        <rect x="20" y="37" width="11" height="2.6" rx="1.3" fill="#C9D6FF"/>
        <circle cx="44" cy="46" r="9" fill="#14C2A0"/>
        <path d="M40 46 L43 49 L48.5 43" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="name">NominIA<span>.app</span></div>
    </div>

    <div class="badge"><span class="dot"></span>Convenios oficiales · tablas 2025</div>

    <h1>¿Te pagan <em>lo que te toca?</em></h1>

    <p class="sub">Sube tu nómina y en <b>10 segundos</b> la comparamos con tu convenio.<br>Si te pagan de menos, lo verás claro.</p>

    <div class="feats">
      <span><span class="tick">✓</span> Gratis y sin registro</span>
      <span><span class="tick">✓</span> 100 % privado</span>
      <span><span class="tick">✓</span> Tu nómina no se guarda</span>
    </div>
    <div class="url">nominia.app</div>
  </div>
</body>
</html>
